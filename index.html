<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Adventure 🇬🇧</title>
<style>
:root{--p:#6C4CF1;--p2:#8B73FF;--pl:#EEEAFF;--b:#3BB5F5;--bl:#E0F4FE;--g:#22C55E;--gl:#DCFCE7;--o:#F59E0B;--ol:#FEF3C7;--r:#EF4444;--rl:#FEE2E2;--t:#1F2340;--m:#6B7091;--bg:#F6F4FF;--sh:0 6px 20px rgba(76,52,200,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh)}
header .logo{font-weight:800;font-size:18px;cursor:pointer;flex:1}
.pill{background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:21px;margin:18px 0 10px}h3{margin:6px 0}
.sub{color:var(--m);margin:0 0 16px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:#fff;border-radius:20px;padding:18px 14px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent;text-align:left}
.tile:hover{transform:translateY(-3px);border-color:var(--p2)}
.tile .ic{font-size:34px}.tile b{display:block;font-size:17px;margin:6px 0 2px}.tile span{color:var(--m);font-size:13px}
.tile.big{background:linear-gradient(135deg,var(--p),#9F7BFF);color:#fff}.tile.big span{color:#EDE8FF}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--p);color:#fff;box-shadow:0 4px 0 #4B32C4;transition:transform .08s;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4B32C4}
.btn.sec{background:#fff;color:var(--p);box-shadow:0 4px 0 #D5CCFF;border:2px solid #D5CCFF}
.btn.g{background:var(--g);box-shadow:0 4px 0 #15913F}.btn.o{background:var(--o);box-shadow:0 4px 0 #B87503}.btn.r{background:var(--r);box-shadow:0 4px 0 #B42323}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--p);font-weight:700;font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:6px;font-family:inherit}
.bar{height:12px;background:#E6E1FF;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--g),#4ADE80);border-radius:99px;transition:width .4s}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.c-neu{background:#EEF0F6;color:#6B7091}.c-lernen{background:var(--rl);color:#B42323}.c-unsicher{background:var(--ol);color:#9A6200}.c-sicher{background:var(--gl);color:#15803D}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.seg button{border:2px solid #D5CCFF;background:#fff;color:var(--t);padding:8px 12px;border-radius:12px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}
.seg button.on{background:var(--p);color:#fff;border-color:var(--p)}
input[type=text],input[type=search]{width:100%;padding:14px 16px;font-size:20px;border:3px solid #D5CCFF;border-radius:16px;outline:none;font-family:inherit}
input:focus{border-color:var(--p)}
.word{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #EEE}
.word .em{font-size:26px;width:36px;text-align:center}.word .tx{flex:1;min-width:0}
.word .en{font-weight:800;font-size:17px}.word .de{color:var(--m);font-size:15px}
.spk{border:0;background:var(--bl);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;flex:none}
.prompt{text-align:center;padding:26px 10px}.prompt .flag{font-size:30px}.prompt .q{font-size:32px;font-weight:800;margin:8px 0;word-break:break-word}
.fb{border-radius:16px;padding:14px 16px;margin-top:14px;font-size:17px;font-weight:600}
.fb.ok{background:var(--gl);color:#15803D}.fb.no{background:var(--rl);color:#B42323}.fb.typo{background:var(--ol);color:#9A6200}
.uml{display:flex;gap:6px;margin:10px 0}.uml button{border:2px solid #D5CCFF;background:#fff;border-radius:10px;width:44px;height:40px;font-size:18px;cursor:pointer;font-family:inherit}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:3px solid #E2DCFF;background:#fff;border-radius:16px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit;color:var(--t)}
.opt:hover{border-color:var(--p2)}.opt.ok{background:var(--gl);border-color:var(--g)}.opt.no{background:var(--rl);border-color:var(--r)}
.flash{perspective:1000px;height:280px;cursor:pointer;margin:10px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--sh)}
.flash .front{background:linear-gradient(135deg,#fff,var(--pl))}.flash .backf{background:linear-gradient(135deg,var(--p),#9F7BFF);color:#fff;transform:rotateY(180deg)}
.flash .face .e{font-size:54px}.flash .face .w{font-size:30px;font-weight:800;margin-top:8px}.flash .face small{opacity:.7;margin-top:10px}
.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(min-width:620px){.pairs{grid-template-columns:repeat(4,1fr)}}
.pt{min-height:84px;border-radius:16px;border:3px solid #E2DCFF;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;cursor:pointer;font-size:15px;transition:all .2s;font-family:inherit;color:var(--t)}
.pt.en{background:var(--bl);border-color:#B7E3FB}.pt.sel{border-color:var(--p);transform:scale(1.05)}.pt.done{opacity:.25;cursor:default;background:var(--gl);border-color:var(--g)}.pt.bad{background:var(--rl);border-color:var(--r)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat{background:var(--pl);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:var(--m)}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:#F3F1FB}.badge .i{font-size:36px}.badge b{display:block;font-size:13px;margin-top:4px}.badge span{font-size:11px;color:var(--m)}
.badge.off{filter:grayscale(1);opacity:.4}
.big-score{font-size:56px;font-weight:900;color:var(--p);text-align:center;margin:0}
.stars{text-align:center;font-size:36px;letter-spacing:4px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid #EEE;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--t);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:transform .3s;z-index:50;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;animation:fall 2.6s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.08)}}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #EEE;gap:10px}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')">🇬🇧 English Adventure</div>
  <div class="pill" id="hPts">⭐ 0</div>
  <div class="pill" id="hStr">🔥 0</div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
/* ================= VOKABELN (aus dem Vokabelheft) ================= */
const VOCAB=[
 // Heftseite 1
 {p:1,en:"if",de:"wenn, falls",e:"🤔"},
 {p:1,en:"(to) need",de:"brauchen, benötigen",e:"🙋"},
 {p:1,en:"at home",de:"daheim, zu Hause",e:"🏡"},
 {p:1,en:"everyone",de:"jeder; alle",e:"👨‍👩‍👧‍👦"},
 {p:1,en:"This is ...",de:"Dies ist ... / Das ist ...",e:"👉"},
 {p:1,en:"street",de:"die Straße",e:"🏘️"},
 {p:1,en:"It's called ...",de:"Er/Sie/Es heißt ...",deA:["er heißt","sie heißt","es heißt"],e:"🏷️"},
 {p:1,en:"road",de:"die Straße (Landstraße zwischen Orten; Straße in Orten)",deS:"die Straße (Landstraße)",deA:["die Straße","die Landstraße"],e:"🛣️"},
 {p:1,en:"car",de:"das Auto",e:"🚗"},
 {p:1,en:"house",de:"das Haus",e:"🏠"},
 {p:1,en:"a lot of",de:"viel ..., viele ...",e:"🍬"},
 {p:1,en:"lots of",de:"viel ..., viele ...",e:"🎈"},
 {p:1,en:"postman",de:"der Briefträger, der Postbote",e:"📮"},
 {p:1,en:"morning",de:"der Morgen, der Vormittag",e:"🌅"},
 {p:1,en:"doorbell",de:"die Türklingel, die Türglocke",e:"🛎️"},
 {p:1,en:"bell",de:"die Klingel, die Glocke",e:"🔔"},
 // Heftseite 2
 {p:2,en:"maybe",de:"vielleicht",e:"🤷"},
 {p:2,en:"dad",de:"der Papa, der Vati",e:"👨"},
 {p:2,en:"mum",de:"die Mama, die Mutti",e:"👩"},
 {p:2,en:"(to) come",de:"kommen",e:"🚶"},
 {p:2,en:"so",de:"also; deshalb, daher",e:"➡️"},
 {p:2,en:"you're",de:"du bist",e:"🫵"},
 {p:2,en:"her class",de:"ihre Klasse",e:"👩‍🏫"},
 {p:2,en:"room",de:"das Zimmer, der Raum",e:"🛏️"},
 {p:2,en:"upstairs",de:"oben; nach oben (im Haus)",e:"⬆️"},
 {p:2,en:"downstairs",de:"unten; nach unten (im Haus)",e:"⬇️"},
 {p:2,en:"why?",de:"warum?",e:"❓"},
 {p:2,en:"an hour",de:"eine Stunde",enA:["an hour","one hour"],e:"⏰"},
 {p:2,en:"for",de:"für",e:"🎁"},
 {p:2,en:"It/He/She isn't here.",de:"Es/Er/Sie ist nicht hier.",enA:["it isn't here","he isn't here","she isn't here"],deA:["es ist nicht hier","er ist nicht hier","sie ist nicht hier"],say:"She isn't here.",e:"🚪"},
 {p:2,en:"not",de:"nicht",e:"🚫"},
 {p:2,en:"here",de:"hier; hierher",e:"📍"},
 {p:2,en:"Sorry.",de:"Verzeihung. / Entschuldigung.",e:"🙏"},
 {p:2,en:"Who?",de:"Wer?",e:"🙋‍♀️"},
 {p:2,en:"brother",de:"der Bruder",e:"👦"},
 // Heftseite 3
 {p:3,en:"sister",de:"die Schwester",e:"👧"},
 {p:3,en:"Yes, I am.",de:"Ja, das bin ich.",enA:["yes, i am","yes i am"],deA:["ja, das bin ich","ja das bin ich"],e:"🙋"},
 {p:3,en:"See you.",de:"Bis gleich. / Bis bald.",e:"👋"},
 {p:3,en:"You're lucky.",de:"Du hast Glück.",e:"🍀"},
 {p:3,en:"sure",de:"sicher",e:"👍"},
 {p:3,en:"smile",de:"das Lächeln",e:"😊"},
 {p:3,en:"sometimes",de:"manchmal",e:"🌦️"},
 {p:3,en:"weird",de:"seltsam, komisch",e:"🤪"},
 {p:3,en:"at school",de:"in der Schule",e:"🏫"},
 {p:3,en:"she's (she is)",de:"sie ist ...",e:"👩"},
 {p:3,en:"they aren't",de:"sie sind nicht",e:"🙅"},
 {p:3,en:"divorced",de:"geschieden",e:"💔"},
 {p:3,en:"they're",de:"sie sind",e:"👫"},
 {p:3,en:"parents (pl)",de:"Eltern",e:"👨‍👩‍👧"},
 {p:3,en:"(to) listen",de:"zuhören, horchen",e:"👂"},
 {p:3,en:"phone",de:"das (Mobil-)Telefon, das Handy",deA:["das Telefon","das Mobiltelefon","das Handy"],e:"📱"},
 {p:3,en:"message",de:"die Nachricht, die SMS",e:"💬"},
 {p:3,en:"free",de:"frei",e:"🆓"},
 {p:3,en:"(to) hang out (infml)",de:"hängen, abhängen, rumhängen",e:"🛋️"},
 // Heftseite 4
 {p:4,en:"at my place",de:"bei mir",e:"🏠"},
 {p:4,en:"place",de:"der Ort, der Platz, die Stelle",e:"📌"},
 {p:4,en:"(to) know",de:"kennen",e:"🤝"},
 {p:4,en:"primary school",de:"die Grundschule",e:"🎒"},
 {p:4,en:"again",de:"wieder, noch einmal",e:"🔁"},
 {p:4,en:"Good morning.",de:"Guten Morgen.",e:"☀️"},
 {p:4,en:"Here's ... (= Here is ...) / Here are ...",de:"Hier ist ... / Hier sind ...",enA:["here's","here is","here are"],say:"Here is. Here are.",e:"🫴"},
 {p:4,en:"parcel",de:"das Paket, das Päckchen",e:"📦"},
 {p:4,en:"very big",de:"sehr groß",e:"🐘"},
 {p:4,en:"(to) understand",de:"verstehen",e:"💡"},
 {p:4,en:"father",de:"der Vater",e:"👨‍🦱"},
 {p:4,en:"mother",de:"die Mutter",e:"👩‍🦰"},
 {p:4,en:"useful",de:"nützlich",e:"🛠️"},
 {p:4,en:"phrase",de:"der Satz, der Ausdruck, die Redewendung",e:"💭"}
];

/* ================= ANTWORT-LOGIK ================= */
function splitVar(s){return s.replace(/\(.*?\)/g," ").split(/[,;\/]/).map(x=>x.trim()).filter(x=>x.replace(/[.\s…?!]/g,""))}
function normEN(s){
  s=s.toLowerCase().replace(/[’`´]/g,"'").replace(/\(.*?\)/g," ").replace(/\.\.\.|…/g," ");
  s=s.replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/'m\b/g," am").replace(/'ll\b/g," will");
  s=s.replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
  return s.replace(/^(to|the)\s+/,"");
}
function normDE(s){
  s=s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/\(.*?\)/g," ");
  s=s.replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
  return s.replace(/^(der|die|das|den|dem|ein|eine|einen)\s+/,"");
}
VOCAB.forEach((v,i)=>{
  v.id=v.p+"|"+v.en;
  v.enList=v.enA||splitVar(v.en);
  v.deList=v.deA||splitVar(v.de);
  v.enN=[...new Set(v.enList.map(normEN))];
  v.deN=[...new Set(v.deList.map(normDE))];
});
function overlap(a,b){return a.enN.some(x=>b.enN.includes(x))||a.deN.some(x=>b.deN.includes(x))}
function accepted(i,dir){ // dir en2de: Deutsch wird gesucht
  const q=VOCAB[i],set=new Set();
  VOCAB.forEach(v=>{
    if(dir==="en2de"){ if(v===q||v.enN.some(x=>q.enN.includes(x))) v.deN.forEach(x=>set.add(x)); }
    else { if(v===q||v.deN.some(x=>q.deN.includes(x))) v.enN.forEach(x=>set.add(x)); }
  });
  return [...set];
}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i]}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function check(input,i,dir){
  const n=dir==="en2de"?normDE(input):normEN(input), acc=accepted(i,dir), ns=n.replace(/ /g,"");
  if(!n) return {ok:false};
  if(acc.some(a=>a===n||a.replace(/ /g,"")===ns)) return {ok:true};
  if(S.settings.typo && ns.length>=4 && acc.some(a=>lev(a.replace(/ /g,""),ns)<=1)) return {ok:true,typo:true};
  return {ok:false};
}
const shownQ=(i,dir)=>dir==="en2de"?VOCAB[i].en:VOCAB[i].de;
const shownA=(i,dir)=>dir==="en2de"?VOCAB[i].de:VOCAB[i].en;
const shortDe=i=>VOCAB[i].deS||VOCAB[i].de;

/* ================= SPEICHER ================= */
const KEY="englishAdventure_v1";
function load(){const d={points:0,streak:0,lastDay:null,words:{},tests:[],badges:[],daily:null,settings:{typo:false,sound:true},setup:{dir:"mix",scope:"all"},fcDir:"en2de",pairsDone:0};
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);Object.assign(d,o);d.settings=Object.assign({typo:false,sound:true},o.settings||{});}}catch(e){}return d}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ws(i){const id=VOCAB[i].id;return S.words[id]||(S.words[id]={box:0,right:0,wrong:0,seen:false,last:0})}
function status(i){const w=ws(i);if(!w.seen)return"neu";if(w.box>=4)return"sicher";if(w.box>=2)return"unsicher";return"lernen"}
const ST_LABEL={neu:"Neu",lernen:"Noch lernen",unsicher:"Unsicher",sicher:"Sicher"};
function record(i,ok){const w=ws(i);w.seen=true;w.last=Date.now();if(ok){w.right++;w.box=Math.min(5,w.box+1)}else{w.wrong++;w.box=Math.max(0,w.box-2)}save()}

/* ================= DATUM / SERIE / PUNKTE ================= */
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmt(new Date()), yday=()=>fmt(new Date(Date.now()-864e5));
function curStreak(){return (S.lastDay===today()||S.lastDay===yday())?S.streak:0}
function markActivity(){const t=today();if(S.lastDay===t)return;S.streak=(S.lastDay===yday())?S.streak+1:1;S.lastDay=t;save()}
function addPoints(n){S.points+=n;markActivity();save();updateHeader();checkBadges()}
function updateHeader(){document.getElementById("hPts").textContent="⭐ "+S.points;document.getElementById("hStr").textContent="🔥 "+curStreak()}

/* ================= DAILY CHALLENGE ================= */
const DAILY=[
 {txt:"Beantworte heute 15 Fragen richtig",target:15,ev:"correct"},
 {txt:"Schaffe im 10-Fragen-Test mindestens 8 richtige",target:1,ev:"test8"},
 {txt:"Lerne heute 10 Karteikarten",target:10,ev:"card"},
 {txt:"Löse heute ein Paare-Spiel",target:1,ev:"pairs"}];
function daily(){const t=today();if(!S.daily||S.daily.date!==t){S.daily={date:t,type:Math.floor(Date.parse(t)/864e5)%DAILY.length,progress:0,done:false};save()}return S.daily}
function dailyEvent(ev){const d=daily(),c=DAILY[d.type];if(d.done||c.ev!==ev)return;d.progress++;
  if(d.progress>=c.target){d.done=true;S.points+=30;save();setTimeout(()=>{toast("🎁 Daily Challenge geschafft! +30 ⭐");confetti()},600)}save();updateHeader();checkBadges()}

/* ================= ABZEICHEN ================= */
const nSicher=()=>VOCAB.filter((v,i)=>status(i)==="sicher").length;
const BADGES=[
 {id:"t1",i:"📝",n:"Erster Test",d:"1 Test gemacht",t:()=>S.tests.length>=1},
 {id:"p50",i:"🥉",n:"English Rookie",d:"50 Punkte",t:()=>S.points>=50},
 {id:"p150",i:"🥈",n:"Word Hunter",d:"150 Punkte",t:()=>S.points>=150},
 {id:"p300",i:"🥇",n:"Vocabulary Star",d:"300 Punkte",t:()=>S.points>=300},
 {id:"p500",i:"🏆",n:"English Champion",d:"500 Punkte",t:()=>S.points>=500},
 {id:"p1000",i:"👑",n:"English Legend",d:"1000 Punkte",t:()=>S.points>=1000},
 {id:"perf",i:"💯",n:"Perfekt!",d:"10/10 im Test",t:()=>S.tests.some(x=>x.score===10)},
 {id:"s3",i:"🔥",n:"Dranbleiberin",d:"3 Tage in Folge",t:()=>curStreak()>=3},
 {id:"s7",i:"🌟",n:"Wochen-Heldin",d:"7 Tage in Folge",t:()=>curStreak()>=7},
 {id:"m20",i:"💪",n:"Wortschatz-Profi",d:"20 Wörter sicher",t:()=>nSicher()>=20},
 {id:"mall",i:"🎓",n:"Alles drauf!",d:"Alle Wörter sicher",t:()=>nSicher()===VOCAB.length},
 {id:"pr3",i:"🧩",n:"Paare-Profi",d:"3 Paare-Spiele",t:()=>S.pairsDone>=3}];
function checkBadges(){BADGES.forEach(b=>{if(!S.badges.includes(b.id)&&b.t()){S.badges.push(b.id);save();setTimeout(()=>{toast("🏅 Neues Abzeichen: "+b.i+" "+b.n);confetti()},900)}})}

const app=()=>document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function weight(i){const w=ws(i);return (6-w.box)*(6-w.box)/4+(w.wrong>w.right?3:0)+(w.seen?0:1.5)+.5}
function pick(pool,n){const arr=pool.map(i=>({i,w:weight(i)})),out=[];
  while(out.length<n&&arr.length){let tot=arr.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;for(;k<arr.length-1;k++){r-=arr[k].w;if(r<=0)break}out.push(arr[k].i);arr.splice(k,1)}return out}
const ALL=VOCAB.map((v,i)=>i);
function hardList(){return ALL.filter(i=>{const w=ws(i);return (w.seen&&w.box<=2)||w.wrong>w.right})}
function poolFor(scope){
  if(scope==="hard"){let h=hardList();if(h.length<10){const rest=ALL.filter(i=>!h.includes(i)).sort((a,b)=>ws(a).box-ws(b).box);h=h.concat(rest.slice(0,10-h.length))}return h}
  if(/^p\d$/.test(scope))return ALL.filter(i=>VOCAB[i].p===+scope[1]);
  return ALL;
}
function speakText(i){const v=VOCAB[i];return v.say||v.en.replace(/\(.*?\)/g," ").split("/")[0].replace(/\.\.\.|…/g," ").trim()}
function speak(i){try{const u=new SpeechSynthesisUtterance(speakText(i));u.lang="en-GB";u.rate=.85;
  const vs=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));if(vs.length)u.voice=vs[0];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const spkBtn=i=>`<button class="spk" title="Vorlesen" onclick="event.stopPropagation();speak(${i})">🔊</button>`;
let AC=null;
function beep(ok){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const notes=ok?[660,880]:[260,200];notes.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.15,AC.currentTime+k*.12);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+k*.12+.18);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+k*.12);o.stop(AC.currentTime+k*.12+.2)})}catch(e){}}
let tT=null;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2600)}
function confetti(){const c=["#6C4CF1","#3BB5F5","#22C55E","#F59E0B","#EC4899","#FACC15"];for(let k=0;k<80;k++){const d=document.createElement("div");d.className="cf";
  d.style.left=Math.random()*100+"vw";d.style.background=c[k%c.length];d.style.animationDelay=Math.random()*.6+"s";d.style.animationDuration=(2+Math.random()*1.5)+"s";
  document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
const backBtn=(t="← Zurück",to="home")=>`<button class="back" onclick="go('${to}')">${t}</button>`;
function progressBar(a,b){return `<div class="bar"><div style="width:${b?Math.round(a/b*100):0}%"></div></div>`}

let LF={f:"all",q:""};
function learn(){

  document.getElementById("wl").innerHTML=items.length?items.map(i=>{const v=VOCAB[i],s=status(i);return `
   <div class="word"><div class="em">${v.e||"🔤"}</div>
    <div class="tx"><div class="en">${esc(v.en)}</div><div class="de">${esc(v.de)}</div>

function setSt(i,s){const w=ws(i);if(!w.seen)addPoints(1);w.seen=true;w.box=s==="sicher"?Math.max(w.box,4):s==="unsicher"?2:0;save();markActivity();drawList();checkBadges()}

/* ================= KARTEIKARTEN ================= */
let FC=null;
function cards(){FC={items:pick(ALL,10),i:0,known:0,fl:false};drawCard()}
function drawCard(){
  if(FC.i>=FC.items.length){addPoints(0);app().innerHTML=`${backBtn()}<div class="card" style="text-align:center"><div style="font-size:60px">🎉</div><h1>Stapel geschafft!</h1>

  const i=FC.items[FC.i],v=VOCAB[i],d=S.fcDir;
  const front=d==="en2de"?`🇬🇧`:`🇩🇪`, frontW=d==="en2de"?v.en:v.de, backW=d==="en2de"?v.de:v.en;
  app().innerHTML=`${backBtn()}<div class="row" style="justify-content:space-between"><h1>🃏 Karteikarten</h1>
   <div class="seg" style="margin:0"><button class="${d==="en2de"?"on":""}" onclick="S.fcDir='en2de';save();drawCard()">🇬🇧→🇩🇪</button><button class="${d==="de2en"?"on":""}" onclick="S.fcDir='de2en';save();drawCard()">🇩🇪→🇬🇧</button></div></div>
   <p class="sub">Karte ${FC.i+1} von ${FC.items.length} · Tippe auf die Karte zum Umdrehen</p>${progressBar(FC.i,FC.items.length)}
   <div class="flash ${FC.fl?"fl":""}" id="fc" onclick="flip()"><div class="in">
     <div class="face front"><div class="e">${v.e||"🔤"}</div><div>${front}</div><div class="w">${esc(frontW)}</div>${d==="en2de"?`<div style="margin-top:10px">${spkBtn(i)}</div>`:""}<small>👆 Antippen</small></div>
     <div class="face backf"><div>${d==="en2de"?"🇩🇪":"🇬🇧"}</div><div class="w">${esc(backW)}</div>${d==="de2en"?`<div style="margin-top:10px">${spkBtn(i)}</div>`:""}</div>
   </div></div>
   <div id="fcb" class="row" style="justify-content:center;visibility:${FC.fl?"visible":"hidden"}">
     <button class="btn r" onclick="rate(0)">❌ Noch lernen</button><button class="btn o" onclick="rate(1)">🤔 Fast</button><button class="btn g" onclick="rate(2)">✅ Gewusst</button></div>`;
}
function flip(){FC.fl=!FC.fl;document.getElementById("fc").classList.toggle("fl",FC.fl);document.getElementById("fcb").style.visibility=FC.fl?"visible":"hidden";
  if(FC.fl&&S.fcDir==="de2en")speak(FC.items[FC.i])}
function rate(r){const i=FC.items[FC.i],w=ws(i);w.seen=true;w.last=Date.now();
  if(r===0){w.wrong++;w.box=0;beep(false)}else if(r===1){w.box=Math.max(1,Math.min(w.box,2))}else{w.right++;w.box=Math.min(5,w.box+1);FC.known++;beep(true);addPoints(2)}
  save();markActivity();dailyEvent("card");FC.i++;FC.fl=false;drawCard()}

/* ================= MULTIPLE CHOICE ================= */
let MC=null;
function mc(){MC={items:pick(ALL,10).map(i=>({i,dir:Math.random()<.5?"en2de":"de2en"})),k:0,score:0,locked:false};drawMC()}
function drawMC(){
  if(MC.k>=MC.items.length){app().innerHTML=`${backBtn()}<div class="card" style="text-align:center"><div style="font-size:60px">${MC.score>=8?"🏆":MC.score>=5?"👏":"💪"}</div>
    <h1>${MC.score} / ${MC.items.length} richtig</h1><p class="sub">${MC.score>=8?"Super gemacht!":MC.score>=5?"Gut! Da geht noch mehr.":"Übung macht den Meister!"}</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="mc()">🔄 Nochmal</button><button class="btn sec" onclick="go('home')">🏠 Home</button></div></div>`;if(MC.score>=8)confetti();return}
  const {i,dir}=MC.items[MC.k],q=VOCAB[i];
  const others=shuffle(ALL.filter(j=>j!==i&&!overlap(VOCAB[j],q))),dist=[];
  for(const j of others){if(dist.length>=3)break;if(dist.every(x=>!overlap(VOCAB[x],VOCAB[j])))dist.push(j)}
  MC.opts=shuffle([i,...dist]);MC.locked=false;
  const ot=j=>dir==="en2de"?shortDe(j):VOCAB[j].en;
  app().innerHTML=`${backBtn()}<h1>🎯 Quiz</h1><p class="sub">Frage ${MC.k+1} von ${MC.items.length} · ⭐ ${MC.score} richtig</p>${progressBar(MC.k,MC.items.length)}
   <div class="card prompt"><div class="flag">${q.e||""} ${dir==="en2de"?"🇬🇧":"🇩🇪"}</div><div class="q">${esc(shownQ(i,dir))}</div>
   ${dir==="en2de"?spkBtn(i):""}<p class="sub" style="margin:8px 0 0">${dir==="en2de"?"Was heißt das auf Deutsch?":"Wie heißt das auf Englisch?"}</p></div>
   <div class="opts">${MC.opts.map((j,n)=>`<button class="opt" id="o${n}" onclick="ansMC(${n})">${esc(ot(j))}</button>`).join("")}</div>`;
  if(dir==="en2de")speak(i);
}
function ansMC(n){if(MC.locked)return;MC.locked=true;const {i}=MC.items[MC.k],ok=MC.opts[n]===i;
  MC.opts.forEach((j,m)=>{if(j===i)document.getElementById("o"+m).classList.add("ok")});
  if(!ok)document.getElementById("o"+n).classList.add("no","shake");
  record(i,ok);beep(ok);if(ok){MC.score++;addPoints(5);dailyEvent("correct")}else markActivity();
  if(MC.items[MC.k].dir==="de2en")speak(i);
  setTimeout(()=>{MC.k++;drawMC()},ok?900:1900)}

/* ================= PAARE FINDEN ================= */
let PR=null;
function pairs(){
  const cand=pick(ALL,ALL.length),sel=[];
  for(const j of cand){if(sel.length>=6)break;if(sel.every(x=>!overlap(VOCAB[x],VOCAB[j])))sel.push(j)}
  PR={tiles:shuffle(sel.flatMap(i=>[{i,s:"en"},{i,s:"de"}])),first:null,done:0,moves:0,t0:Date.now(),lock:false};drawPairs()}
function drawPairs(){
  app().innerHTML=`${backBtn()}<h1>🧩 Paare finden</h1><p class="sub">Finde immer das englische 🇬🇧 (blau) und das deutsche 🇩🇪 Wort, die zusammengehören.</p>
   <div class="row" style="margin-bottom:12px"><span class="chip c-neu">Züge: <span id="pm">${PR.moves}</span></span><span class="chip c-sicher">Paare: <span id="pd">${PR.done}</span> / 6</span></div>
   <div class="pairs">${PR.tiles.map((t,n)=>`<button class="pt ${t.s}" id="t${n}" onclick="tapPair(${n})">${esc(t.s==="en"?VOCAB[t.i].en:shortDe(t.i))}</button>`).join("")}</div>`}
function tapPair(n){
  const t=PR.tiles[n],el=document.getElementById("t"+n);if(PR.lock||t.ok||PR.first===n)return;
  if(t.s==="en")speak(t.i);
  if(PR.first===null){PR.first=n;el.classList.add("sel");return}
  const f=PR.tiles[PR.first],fe=document.getElementById("t"+PR.first);PR.moves++;document.getElementById("pm").textContent=PR.moves;
  if(f.i===t.i&&f.s!==t.s){t.ok=f.ok=true;[el,fe].forEach(x=>{x.classList.remove("sel");x.classList.add("done","pop")});PR.first=null;PR.done++;beep(true);
    document.getElementById("pd").textContent=PR.done;
    if(PR.done===6){const sec=Math.round((Date.now()-PR.t0)/1000);S.pairsDone=(S.pairsDone||0)+1;addPoints(20);dailyEvent("pairs");confetti();
      setTimeout(()=>{app().innerHTML=`${backBtn()}<div class="card" style="text-align:center"><div style="font-size:60px">🧩</div><h1>Alle Paare gefunden!</h1>
      <p class="sub">${PR.moves} Züge · ${sec} Sekunden · +20 ⭐</p><div class="row" style="justify-content:center"><button class="btn" onclick="pairs()">🔄 Nochmal</button><button class="btn sec" onclick="go('home')">🏠 Home</button></div></div>`},900)}}
  else{PR.lock=true;beep(false);[el,fe].forEach(x=>x.classList.add("bad","shake"));
    setTimeout(()=>{[el,fe].forEach(x=>x.classList.remove("bad","shake","sel"));PR.first=null;PR.lock=false},700)}
}

/* ================= TEST / SCHREIB-TRAINING ================= */
let SM="test";
function setup(mode){
  SM=mode||SM;const st=S.setup,isT=SM==="test";
  const dirs=[["en2de","🇬🇧 → 🇩🇪 Deutsch schreiben"],["de2en","🇩🇪 → 🇬🇧 Englisch schreiben"],["mix","🎲 Gemischt"]];
  const scs=[["all","Alle Wörter"],["p1","Seite 1"],["p2","Seite 2"],["p3","Seite 3"],["p4","Seite 4"],["hard","💪 Schwierige Wörter"]];
  app().innerHTML=`${backBtn()}<h1>${isT?"🏆 10-Fragen-Test":"✍️ Schreib-Training"}</h1>
   <p class="sub">${isT?"Genau 10 Fragen. Schreib das Wort in der anderen Sprache. Ohne Tipps – zeig, was du kannst!":"10 Wörter üben. Mit Tipp-Button – falsche Wörter kommen am Ende nochmal dran."}</p>
   <div class="card"><h3>Welche Richtung?</h3><div class="seg">${dirs.map(([k,l])=>`<button class="${st.dir===k?"on":""}" onclick="S.setup.dir='${k}';save();setup()">${l}</button>`).join("")}</div>
   <h3>Welche Wörter?</h3><div class="seg">${scs.map(([k,l])=>`<button class="${st.scope===k?"on":""}" onclick="S.setup.scope='${k}';save();setup()">${l}</button>`).join("")}</div>
   <p class="sub" style="font-size:13px">💡 Groß-/Kleinschreibung und der/die/das bzw. „to“ sind egal. Bei mehreren Bedeutungen reicht eine.</p>
   <button class="btn" style="width:100%;font-size:19px;padding:15px" onclick="startQuiz()">Los geht's! 🚀</button></div>`}
let Q=null;
function startQuiz(items,mode){
  const st=S.setup;
  if(!items){items=pick(poolFor(st.scope),10).map(i=>({i,dir:st.dir==="mix"?(Math.random()<.5?"en2de":"de2en"):st.dir}));mode=SM}
  Q={mode,items,k:0,res:[],answered:false,tries:{},hint:false,dir:st.dir,scope:st.scope};drawQ()}
function drawQ(){
  if(Q.k>=Q.items.length)return endQuiz();
  const {i,dir}=Q.items[Q.k],v=VOCAB[i],isT=Q.mode==="test",total=isT?10:Q.items.length;
  Q.answered=false;Q.hint=false;
  app().innerHTML=`${backBtn("← Abbrechen")}<div class="row" style="justify-content:space-between"><h1>${isT?"🏆 Test":"✍️ Training"}</h1><b>Frage ${Q.k+1} / ${total}</b></div>
   ${progressBar(Q.k,total)}
   <div class="card prompt" style="margin-top:14px"><div class="flag">${v.e||""} ${dir==="en2de"?"🇬🇧":"🇩🇪"}</div><div class="q">${esc(shownQ(i,dir))}</div>
    ${dir==="en2de"?spkBtn(i):""}<p class="sub" style="margin:8px 0 0">${dir==="en2de"?"Schreib das deutsche Wort:":"Schreib das englische Wort:"}</p></div>
   <div class="card"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${dir==="en2de"?"Deutsch …":"English …"}">
    ${dir==="en2de"?`<div class="uml">${["ä","ö","ü","ß"].map(c=>`<button onclick="ins('${c}')">${c}</button>`).join("")}</div>`:""}
    <div id="hint" class="sub" style="margin:8px 0 0;font-size:18px;letter-spacing:2px"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="go" onclick="checkQ()">Prüfen ✔</button>
     ${!isT?`<button class="btn sec" id="hb" onclick="showHint()">💡 Tipp</button>`:""}<button class="btn sec" id="sk" onclick="skipQ()">🤷 Weiß ich nicht</button></div>
    <div id="fb"></div></div>`;
  const a=document.getElementById("ans");a.focus();a.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();Q.answered?nextQ():checkQ()}});
}
function ins(c){const a=document.getElementById("ans"),s=a.selectionStart??a.value.length;a.value=a.value.slice(0,s)+c+a.value.slice(a.selectionEnd??s);a.focus();a.setSelectionRange(s+1,s+1)}
function showHint(){const {i,dir}=Q.items[Q.k],w=(dir==="en2de"?VOCAB[i].deList:VOCAB[i].enList)[0].replace(/\.\.\.|…|[.?!]/g,"").trim();
  const core=dir==="en2de"?w.replace(/^(der|die|das)\s+/i,""):w.replace(/^to\s+/i,"");
  const art=w.slice(0,w.length-core.length);
  document.getElementById("hint").textContent="💡 "+art+core.split("").map((c,n)=>n===0||c===" "||c==="'"?c:"_").join(" ");Q.hint=true}
function skipQ(){if(Q.answered)return;document.getElementById("ans").value="";checkQ(true)}
function checkQ(skip){
  if(Q.answered)return nextQ();
  const a=document.getElementById("ans"),val=a.value.trim(),it=Q.items[Q.k];
  if(!val&&!skip){a.classList.add("shake");setTimeout(()=>a.classList.remove("shake"),400);return}
  const r=skip?{ok:false}:check(val,it.i,it.dir);
  Q.answered=true;record(it.i,r.ok);beep(r.ok);
  Q.res.push({i:it.i,dir:it.dir,ok:r.ok,val});
  const right=shownA(it.i,it.dir),fb=document.getElementById("fb");
  if(r.ok){const pts=Q.mode==="test"?10:(Q.hint?2:5);addPoints(pts);dailyEvent("correct");
    fb.innerHTML=`<div class="fb ${r.typo?"typo":"ok"} pop">${r.typo?"👍 Fast perfekt – achte auf die Schreibweise!":["🎉 Richtig!","⭐ Super!","🚀 Klasse!","💪 Stark!"][Math.floor(Math.random()*4)]} <span style="float:right">+${pts} ⭐</span><br><small>${esc(right)}</small></div>`;
    if(Math.random()<.25)confetti()}
  else{markActivity();fb.innerHTML=`<div class="fb no shake">${skip?"🤷 Kein Problem!":"❌ Noch nicht ganz."} Richtig ist:<br><b style="font-size:20px">${esc(right)}</b></div>`;
    if(Q.mode==="practice"){Q.tries[it.i]=(Q.tries[it.i]||0)+1;if(Q.tries[it.i]<=2)Q.items.push({...it})}}
  if(it.dir==="de2en")speak(it.i);
  a.disabled=true;document.getElementById("go").textContent=Q.k+1>=Q.items.length?"Ergebnis 🏁":"Weiter →";
  ["hb","sk"].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display="none"});
  setTimeout(()=>{document.addEventListener("keydown",enterNext,{once:true})},50);
}
function enterNext(e){if(e.key==="Enter"&&Q&&Q.answered)nextQ();else if(Q&&Q.answered)document.addEventListener("keydown",enterNext,{once:true})}
function nextQ(){document.removeEventListener("keydown",enterNext);Q.k++;drawQ()}
function endQuiz(){
  const isT=Q.mode==="test";
  if(!isT){const firstRes={};Q.res.forEach(r=>{if(!(r.i in firstRes))firstRes[r.i]=r.ok});const n=Object.keys(firstRes).length,ok=Object.values(firstRes).filter(Boolean).length;
    app().innerHTML=`${backBtn()}<div class="card" style="text-align:center"><div style="font-size:60px">✍️</div><h1>Training geschafft!</h1>
     <p class="sub">${ok} von ${n} Wörtern beim ersten Versuch richtig. Alle anderen hast du nochmal geübt. 💪</p>
     <div class="row" style="justify-content:center"><button class="btn" onclick="go('setup','practice')">🔄 Nochmal üben</button><button class="btn sec" onclick="go('setup','test')">🏆 Zum Test</button><button class="btn sec" onclick="go('home')">🏠 Home</button></div></div>`;confetti();return}
  const score=Q.res.filter(r=>r.ok).length,wrong=Q.res.filter(r=>!r.ok);
  S.tests.push({date:Date.now(),score,dir:Q.dir,scope:Q.scope,wrong:wrong.map(r=>VOCAB[r.i].id)});save();
  if(score>=8)dailyEvent("test8");if(score===10){addPoints(50);toast("💯 Perfekt! +50 Bonus-⭐")}checkBadges();
  const stars=Math.round(score/2),msg=score===10?"Perfekt! Du bist ein English Star! 🌟":score>=8?"Super gemacht! 🎉":score>=6?"Gut! Ein paar Wörter noch üben. 👍":score>=4?"Weiter üben – du schaffst das! 💪":"Nicht aufgeben – Übung macht den Meister! 🌱";
  app().innerHTML=`${backBtn()}<div class="card"><div style="text-align:center"><div style="font-size:54px">${score>=8?"🏆":score>=5?"👏":"🌱"}</div><h1>Test geschafft!</h1></div>
   <p class="big-score">${score} / 10</p><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(5-stars)}</div>
   <p style="text-align:center;font-size:18px;font-weight:700">${score*10} % · ${msg}</p></div>
   <div class="card"><h3>Deine Antworten</h3><table>${Q.res.map(r=>`<tr><td>${r.ok?"✅":"❌"}</td><td><b>${esc(shownQ(r.i,r.dir))}</b></td><td>${r.ok?esc(r.val):`<s style="color:var(--r)">${esc(r.val||"–")}</s><br><span style="color:#15803D">${esc(shownA(r.i,r.dir))}</span>`}</td></tr>`).join("")}</table></div>
   <div class="row" style="justify-content:center">${wrong.length?`<button class="btn o" onclick='practiceWrong()'>🔄 Fehler noch einmal üben</button>`:""}<button class="btn" onclick="go('setup','test')">🏆 Neuer Test</button><button class="btn sec" onclick="go('home')">🏠 Home</button></div>`;
  if(score>=8)confetti();
}
function practiceWrong(){const items=Q.res.filter(r=>!r.ok).map(r=>({i:r.i,dir:r.dir}));startQuiz(items,"practice")}

/* ================= ERFOLGE & LERNSTAND ================= */
function stats(){
  const cnt={neu:0,lernen:0,unsicher:0,sicher:0};ALL.forEach(i=>cnt[status(i)]++);
  const t=S.tests,last=t[t.length-1],l5=t.slice(-5),avg=l5.length?Math.round(l5.reduce((a,b)=>a+b.score,0)/l5.length*10):null;
  const worst=ALL.filter(i=>ws(i).wrong>0).sort((a,b)=>(ws(b).wrong-ws(b).right)-(ws(a).wrong-ws(a).right)||ws(b).wrong-ws(a).wrong).slice(0,5);
  const dirL={en2de:"🇬🇧→🇩🇪",de2en:"🇩🇪→🇬🇧",mix:"🎲"},scL={all:"Alle",p1:"S. 1",p2:"S. 2",p3:"S. 3",p4:"S. 4",hard:"Schwierige"};
  app().innerHTML=`${backBtn()}<h1>⭐ Erfolge & Lernstand</h1>
  <div class="card"><h3>🏅 Abzeichen (${S.badges.length}/${BADGES.length})</h3>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(105px,1fr));margin-top:10px">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?"":"off"}"><div class="i">${b.i}</div><b>${b.n}</b><span>${b.d}</span></div>`).join("")}</div></div>
  <div class="card"><h3>📊 Lernstand</h3><div class="stats" style="margin-top:10px">
   <div class="stat"><b>${VOCAB.length}</b><span>Vokabeln</span></div><div class="stat" style="background:var(--gl)"><b>${cnt.sicher}</b><span>🟢 Sicher</span></div>
   <div class="stat" style="background:var(--ol)"><b>${cnt.unsicher}</b><span>🟡 Unsicher</span></div><div class="stat" style="background:var(--rl)"><b>${cnt.lernen}</b><span>🔴 Noch lernen</span></div>
   <div class="stat"><b>${cnt.neu}</b><span>🆕 Noch nicht geübt</span></div><div class="stat"><b>${S.points}</b><span>⭐ Punkte</span></div>
   <div class="stat"><b>${curStreak()}</b><span>🔥 Tage in Folge</span></div><div class="stat"><b>${t.length}</b><span>📝 Tests</span></div></div></div>
  <div class="card"><h3>👨‍👧 Für Eltern</h3>
   <p>Letzter Test: <b>${last?last.score+" / 10 ("+new Date(last.date).toLocaleDateString("de-DE")+")":"–"}</b><br>Ø letzte ${l5.length||5} Tests: <b>${avg!==null?avg+" %":"–"}</b></p>
   <p style="margin-bottom:6px"><b>Häufigste Fehler:</b></p>${worst.length?`<table>${worst.map(i=>`<tr><td><b>${esc(VOCAB[i].en)}</b></td><td>${esc(VOCAB[i].de)}</td><td>❌ ${ws(i).wrong} · ✅ ${ws(i).right}</td></tr>`).join("")}</table>`:`<p class="sub">Noch keine Fehler 🎉</p>`}
   ${t.length?`<p style="margin:14px 0 6px"><b>Testverlauf:</b></p><table><tr><th>Datum</th><th>Richtung</th><th>Wörter</th><th>Ergebnis</th></tr>${t.slice(-10).reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${dirL[x.dir]||""}</td><td>${scL[x.scope]||""}</td><td><b>${x.score}/10</b></td></tr>`).join("")}</table>`:""}</div>
  <div class="card"><h3>⚙️ Einstellungen</h3>
   <div class="toggle"><div><b>Kleine Tippfehler erlauben</b><br><small class="sub">z. B. „brohter“ statt „brother“ zählt als richtig (mit Hinweis). Aus = strenge Rechtschreibung wie in der Schule.</small></div><input type="checkbox" ${S.settings.typo?"checked":""} onchange="S.settings.typo=this.checked;save()" style="width:24px;height:24px"></div>
   <div class="toggle"><div><b>Töne</b></div><input type="checkbox" ${S.settings.sound?"checked":""} onchange="S.settings.sound=this.checked;save()" style="width:24px;height:24px"></div>
   <div style="margin-top:14px" class="row"><button class="btn sec sm" onclick="document.getElementById('allw').style.display='block'">📋 Alle Wörter mit Statistik</button><button class="btn r sm" onclick="resetAll()">🗑️ Lernstand zurücksetzen</button></div>
   <div id="allw" style="display:none;margin-top:12px"><table><tr><th>Englisch</th><th>Deutsch</th><th>Status</th><th>✅/❌</th></tr>${ALL.map(i=>{const s=status(i),w=ws(i);return `<tr><td>${esc(VOCAB[i].en)}</td><td>${esc(VOCAB[i].de)}</td><td><span class="chip c-${s}">${ST_LABEL[s]}</span></td><td>${w.right}/${w.wrong}</td></tr>`}).join("")}</table></div></div>`;
}
function resetAll(){if(confirm("Wirklich den kompletten Lernstand, alle Punkte und Abzeichen löschen?")){try{localStorage.removeItem(KEY)}catch(e){}S=load();go("home");toast("Lernstand zurückgesetzt")}}

/* ================= START ================= */
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go("home");
</script>
</body>
