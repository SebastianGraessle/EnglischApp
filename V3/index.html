<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>English Adventure</title>
<style>
:root{
  --p:#5B4BDB;--p-d:#4636C2;--p-l:#EEEBFF;--p-m:#D9D3FF;
  --bg:#F5F4FA;--card:#fff;--t:#1E2235;--m:#686D85;--line:#E8E6F0;
  --ok:#15803D;--ok-b:#22A355;--ok-l:#E6F6EC;
  --warn:#B45309;--warn-b:#E68A00;--warn-l:#FFF3DF;
  --bad:#B91C1C;--bad-l:#FDECEC;
  --der:#2563EB;--die:#DC2626;--das:#16A34A;
  --r:22px;--sh:0 1px 2px rgba(30,34,53,.04),0 8px 28px rgba(30,34,53,.07);
  --navh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}

/* ---------- Kopf ---------- */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(245,244,250,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#top .who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0;flex:1;text-align:left}
#top .av{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:23px;flex:none}
#top .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .nm small{display:block;font-weight:500;color:var(--m);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px;white-space:nowrap}
#top .x{display:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}
body.focus #top .who,body.focus #top .pill{display:none}
body.focus #top .x{display:grid;place-items:center}
#runbar{flex:1;display:none}
body.focus #runbar{display:block}

/* ---------- Inhalt ---------- */
main{max-width:780px;margin:0 auto;padding:6px 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom))}
body.focus main{padding-bottom:40px}
h1{font-size:28px;line-height:1.15;margin:8px 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:22px 0 10px}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--m)}
.small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:380px){.grid3{grid-template-columns:1fr 1fr}}

/* ---------- Knöpfe ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:16px;border:0;background:var(--p);color:#fff;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--p-d);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--p-d)}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:20px;border-radius:20px}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--p-m);box-shadow:none}
.btn.ghost{background:transparent;color:var(--p);box-shadow:none;min-height:44px;padding:8px 12px}
.btn.ok{background:var(--ok-b);box-shadow:0 3px 0 #17803F}
.btn.warn{background:var(--warn-b);box-shadow:0 3px 0 #B86E00}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #F3C7C7;box-shadow:none}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--p);font-weight:700;padding:6px 0}

/* ---------- Heute ---------- */
.hero{background:linear-gradient(150deg,#5B4BDB 0%,#7B5BE6 60%,#9A6FEA 100%);color:#fff;border-radius:26px;padding:20px;box-shadow:0 12px 32px rgba(91,75,219,.28);margin-bottom:14px}
.hero .lbl{opacity:.85;font-size:14px;font-weight:600}
.hero h2{margin:2px 0 10px;font-size:26px}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.hero .bar{background:rgba(255,255,255,.22)}
.hero .bar>div{background:#fff}
.hero .btn{background:#fff;color:var(--p);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.hero .btn.sec{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.4);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--p-l);color:var(--p)}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.warn{background:var(--warn-l);color:var(--warn)}
.chip.grey{background:#EFEFF4;color:var(--m)}
.bar{height:10px;border-radius:99px;background:var(--p-l);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok-b),#4ADE80);transition:width .5s}
.plan{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;padding-bottom:2px}
.plan .d{flex:1;min-width:52px;text-align:center;border-radius:14px;padding:8px 4px;background:rgba(255,255,255,.12);font-size:12px;line-height:1.25}
.plan .d b{display:block;font-size:14px}
.plan .d.on{background:#fff;color:var(--p)}
.plan .d.past{opacity:.45}

/* ---------- Kacheln ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;min-height:112px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:30px;line-height:1}
.tile b{font-size:16px;margin-top:6px}
.tile span{font-size:13px;color:var(--m)}

/* ---------- Auswahl ---------- */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:600;min-height:46px}
.seg button.on{border-color:var(--p);background:var(--p-l);color:var(--p)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ugrid button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:700;text-align:center;min-height:62px}
.ugrid button small{display:block;font-weight:500;color:var(--m);font-size:12px}
.ugrid button.on{border-color:var(--p);background:var(--p-l);color:var(--p)}
.ugrid button.done{border-color:#BFE6CB;background:var(--ok-l)}
label.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
label.check input{width:22px;height:22px;accent-color:var(--p)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{min-height:80px;resize:vertical}

/* ---------- Lernaufgaben ---------- */
.task{max-width:640px;margin:0 auto}
.prompt{text-align:center;padding:26px 16px}
.prompt .lang{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.prompt .q{font-size:30px;font-weight:800;margin:10px 0 6px;word-break:break-word;line-height:1.2}
.prompt .em{font-size:52px;line-height:1}
.prompt img,.disc img{max-width:100%;max-height:220px;border-radius:16px;margin:6px auto;display:block}
.spk{width:48px;height:48px;border-radius:50%;border:0;background:var(--p-l);font-size:20px;display:inline-grid;place-items:center;flex:none}
.spk.big{width:84px;height:84px;font-size:36px}
.answer{font-size:22px;padding:16px 18px;border-radius:18px;border:2px solid var(--line);width:100%;outline:none;background:#fff}
.answer:focus{border-color:var(--p)}
.answer.ok{border-color:var(--ok-b);background:var(--ok-l)}
.answer.no{border-color:#E9A2A2;background:var(--bad-l)}
.answer.almost{border-color:#F0C07A;background:var(--warn-l)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.keys button{min-width:46px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px}
.opts{display:grid;gap:10px}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px;font-size:18px;font-weight:700;min-height:64px;text-align:center}
.opt.ok{border-color:var(--ok-b);background:var(--ok-l);color:var(--ok)}
.opt.no{border-color:#E9A2A2;background:var(--bad-l);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:18px;padding:14px 16px;margin-top:14px;font-weight:600}
.fb.ok{background:var(--ok-l);color:var(--ok)}
.fb.no{background:var(--bad-l);color:var(--bad)}
.fb.almost{background:var(--warn-l);color:var(--warn)}
.fb .sol{display:block;font-size:22px;font-weight:800;margin-top:4px;color:var(--t)}
.fb mark{background:#FFD98A;color:inherit;border-radius:3px;padding:0 1px}
.fb .yours{display:block;font-weight:500;color:var(--m);font-size:15px;margin-top:4px}
.disc{text-align:center}
.disc .w{font-size:36px;font-weight:800;margin:6px 0 2px}
.disc .d{font-size:21px;margin-bottom:10px}
.hint{text-align:left;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:16px}
.hint.merk{background:#FFF7E6}
.hint.bsp{background:#EEF6FF}
.hint.own{background:var(--p-l)}
.hint b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;opacity:.7}
.art-der{color:var(--der);font-weight:800}.art-die{color:var(--die);font-weight:800}.art-das{color:var(--das);font-weight:800}
.flash{perspective:1000px;height:300px;margin:6px 0 14px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:#fff;box-shadow:var(--sh)}
.flash .back{transform:rotateY(180deg);background:var(--p-l)}
.flash .w{font-size:32px;font-weight:800}
.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:620px){.pairs{grid-template-columns:repeat(4,1fr)}}
.pt{min-height:86px;border-radius:18px;border:2px solid var(--line);background:#fff;padding:8px;font-weight:700;font-size:15px;transition:all .18s}
.pt.en{background:#F2F7FF;border-color:#D5E6FF}
.pt.sel{border-color:var(--p);transform:scale(1.04)}
.pt.done{opacity:.25;background:var(--ok-l);border-color:#BFE6CB}
.pt.bad{background:var(--bad-l);border-color:#E9A2A2}

/* ---------- Listen ---------- */
.list .it{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list .it:last-child{border-bottom:0}
.list .em{font-size:26px;width:36px;text-align:center;flex:none}
.list .tx{flex:1;min-width:0}
.list .en{font-weight:700}
.list .de{color:var(--m);font-size:15px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:#E3E1EC}
.dots i.on{background:var(--ok-b)}
.unitrow{padding:12px 0;border-bottom:1px solid var(--line)}
.unitrow:last-child{border-bottom:0}
.story p{font-size:19px;line-height:1.6;margin:0 0 12px}
.story b.hl{color:var(--p);background:var(--p-l);border-radius:6px;padding:0 4px}
.story .tr{color:var(--m);font-size:15px;margin-top:-8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:18px;background:#F4F3F9}
.badge .i{font-size:32px}.badge b{display:block;font-size:13px;margin-top:4px}.badge span{font-size:11px;color:var(--m)}
.badge.off{filter:grayscale(1);opacity:.35}
.big-score{font-size:60px;font-weight:900;color:var(--p);text-align:center;line-height:1;margin:6px 0}
.res td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.res{width:100%;border-collapse:collapse}
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.prof button{background:#fff;border:3px solid transparent;border-radius:22px;padding:18px 8px;box-shadow:var(--sh);text-align:center}
.prof button.on{border-color:var(--p)}
.prof .a{font-size:48px;display:block}
.av-pick{display:flex;flex-wrap:wrap;gap:8px}
.av-pick button{width:54px;height:54px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:28px}
.av-pick button.on{border-color:var(--p);background:var(--p-l)}

/* ---------- Navigation ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{display:flex;max-width:560px;margin:0 auto}
#nav button{flex:1;background:none;border:0;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--m)}
#nav .ic{font-size:23px;line-height:1;filter:grayscale(1);opacity:.6}
#nav button.on{color:var(--p)}
#nav button.on .ic{filter:none;opacity:1}
body.focus #nav,body.nonav #nav{display:none}

/* ---------- Sheet, Toast, Banner ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(20,22,40,.42)}
#sheet.on{display:flex}
#sheet .pane{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){#sheet{align-items:center}#sheet .pane{border-radius:26px;max-height:86vh}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,160px);background:var(--t);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:60;transition:transform .3s;max-width:92%;text-align:center}
#toast.on{transform:translate(-50%,0)}
#banner{display:none;background:var(--bad);color:#fff;padding:10px 16px;font-weight:700;font-size:14px;text-align:center}
#banner.on{display:block}
.note{background:var(--warn-l);color:#7A4A00;border-radius:14px;padding:12px 14px;font-size:14px;margin:10px 0}
.note.info{background:var(--p-l);color:#3B2FA0}
.cf{position:fixed;top:-12px;width:9px;height:13px;z-index:70;border-radius:2px;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg)}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Tablet ---------- */
@media(min-width:768px){
  body{font-size:18px}
  main{padding-left:28px;padding-right:28px}
  h1{font-size:32px}
  .two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .prompt .q{font-size:36px}
  .answer{font-size:24px}
}
@media(min-width:900px){main{max-width:980px}}
</style>
</head>
<body>
<div id="banner"></div>
<header id="top">
  <button class="who" onclick="go('profiles')" aria-label="Profil wechseln"><span class="av" id="hAv">🙂</span><span class="nm" id="hNm"></span></button>
  <div id="runbar"></div>
  <span class="pill" id="hStr" title="Lerntage in Folge">🔥 0</span>
  <span class="pill" id="hXp" title="Punkte">⭐ 0</span>
  <button class="x" onclick="quitRun()" aria-label="Beenden">✕</button>
</header>
<main id="app"><div class="card">Lade …</div></main>
<nav id="nav"><div class="in">
  <button data-r="heute" onclick="go('heute')"><span class="ic">🏠</span>Heute</button>
  <button data-r="lernen" onclick="go('lernen')"><span class="ic">📚</span>Lernen</button>
  <button data-r="test" onclick="go('test')"><span class="ic">🏆</span>Test</button>
  <button data-r="fortschritt" onclick="go('fortschritt')"><span class="ic">📈</span>Fortschritt</button>
</div></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="pane" id="sheetIn"></div></div>
<div id="toast"></div>

<script src="vokabeln.js"></script>
<script src="geschichten.js"></script>
<script>
"use strict";
/* =====================================================================
   1. VOKABELN & GESCHICHTEN LADEN
   ===================================================================== */
const RAW=(typeof VOKABELN!=="undefined"&&Array.isArray(VOKABELN))?VOKABELN:[];
const STORIES=(typeof GESCHICHTEN!=="undefined"&&Array.isArray(GESCHICHTEN))?GESCHICHTEN:[];
const str=x=>String(x==null?"":x).trim();
const arr=x=>Array.isArray(x)?x.map(str).filter(Boolean):[];
const V=[];const IDS=new Set();
RAW.forEach(v=>{if(!v||!v.en||!v.de)return;
  const o={buch:str(v.buch)||"Buch",kap:str(v.kapitel)||"Unit",en:str(v.en),de:str(v.de),e:str(v.emoji),
    enAlt:arr(v.enAlt),deAlt:arr(v.deAlt),deKurz:str(v.deKurz),say:str(v.sprich),merk:str(v.merk),
    bsp:str(v.beispiel),bspDe:str(v.beispielDe),geg:str(v.gegenteil),bild:str(v.bild)};
  let id=o.buch+"|"+o.kap+"|"+o.en,n=2;while(IDS.has(id))id=o.buch+"|"+o.kap+"|"+o.en+"#"+(n++);
  IDS.add(id);o.id=id;o.i=V.length;o.uk=o.buch+"|"+o.kap;V.push(o)});
const natSort=(a,b)=>a.localeCompare(b,"de",{numeric:true,sensitivity:"base"});
const BOOKS=[...new Set(V.map(v=>v.buch))];
const UNITS={};V.forEach(v=>{(UNITS[v.uk]=UNITS[v.uk]||{key:v.uk,buch:v.buch,kap:v.kap,idx:[]}).idx.push(v.i)});
const UK=Object.keys(UNITS);const ukIdx=k=>UK.indexOf(k);
const unitsOf=b=>Object.values(UNITS).filter(u=>u.buch===b).sort((a,c)=>natSort(a.kap,c.kap));
const uLabel=k=>{const u=UNITS[k];return u?u.buch+" · "+u.kap:"–"};
const uShort=k=>{const u=UNITS[k];return u?u.kap:"–"};

/* =====================================================================
   2. STRENGE ANTWORTPRÜFUNG (wie die Lehrerin)
   ===================================================================== */
const PH=/\.\.\.|…/g;
function clean(x){return x.replace(/[’‘`´]/g,"'").replace(PH," ").replace(/,/g," ").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim()}
function expandContr(x){return x.replace(/\bcan't\b/gi,m=>m[0]+"annot").replace(/\bwon't\b/gi,m=>(m[0]==="W"?"W":"w")+"ill not")
  .replace(/n't\b/gi," not").replace(/'re\b/gi," are").replace(/'m\b/gi," am").replace(/'ve\b/gi," have").replace(/'ll\b/gi," will")
  .replace(/\b(he|she|it|that|what|who|where|here|there|how)'s\b/gi,"$1 is")}
function variants(src,lang){
  let s=src.replace(/[’‘`´]/g,"'").trim(),optTo=false;
  if(lang==="en"&&/^\(to\)\s*/i.test(s)){optTo=true;s=s.replace(/^\(to\)\s*/i,"")}
  s=s.replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
  const sentence=/([.?!…]|\.\.\.)$/.test(s);
  const parts=sentence?s.split(/\s+\/\s+|(?:\.\.\.|…)\s*[,;]\s*/):s.split(/\s*[;,]\s*|\s+\/\s+/);
  const out=new Set();
  parts.forEach(p=>{let opts=[""];const capOk=/[.?!]$/.test(p.trim())&&!/\.\.\.$/.test(p.trim());
    p.trim().split(/\s+/).forEach(tok=>{const alts=(tok.includes("/")&&tok.length>1)?tok.split("/").filter(Boolean):[tok];
      const n=[];opts.forEach(o=>alts.forEach(a=>n.push(o?o+" "+a:a)));opts=n});
    opts.forEach(o=>{const c=clean(o);if(!c)return;const base=[c];
      if(capOk)base.push(c[0].toUpperCase()+c.slice(1));
      base.forEach(b=>{out.add(b);if(lang==="en"){const e=expandContr(b);out.add(e);if(optTo){out.add("to "+b);out.add("to "+e)}}})})});
  return [...out].filter(Boolean);
}

  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}

function diag(c,v,lang){

    if(m){if(tr(c)===tr(m[2]))return"art-missing";const m2=c.match(/^(der|die|das|den|dem|des|ein|eine|einen)\s+(.+)$/i);

  if(cands.some(c=>acc.includes(c)))return{ok:true};
  let best=null;acc.forEach(v=>cands.forEach(c=>{const t=diag(c,v,lang);if(t&&(!best||RANK[t]<RANK[best.type]))best={type:t,exp:v}}));

function buildSession(k){const idx=unitIdx(k),now=Date.now(),isCur=k===curKey(),MAX=18;
  const newN=Math.min(5,newTargetToday(k));                     // höchstens 5 neue Wörter pro Runde
  const fresh=idx.filter(i=>stage(i)===0).slice(0,newN);
  const learning=idx.filter(i=>stage(i)>=1&&!ready(i)).sort((a,b)=>stage(b)-stage(a)||Wr(b).w-Wr(a).w||Wr(a).last-Wr(b).last);
  const dueReady=idx.filter(i=>ready(i)&&Wr(i).due<=now).sort((a,b)=>Wr(a).due-Wr(b).due);
  let review=[];if(isCur){const old=S.done.flatMap(unitIdx);
    review=old.filter(i=>stage(i)>=1&&Wr(i).due<=now).sort((a,b)=>Wr(a).due-Wr(b).due).slice(0,2);
    if(review.length<2)review=review.concat(shuffle(old.filter(i=>stage(i)===0)).slice(0,2-review.length))}
  const pickDir=i=>{const w=Wr(i);return w.ok.de2en!==true&&w.ok.en2de===true?"de2en":w.ok.en2de!==true&&w.ok.de2en===true?"en2de":Math.random()<.5?"de2en":"en2de"};
  const forWord=i=>stage(i)<=1?(Math.random()<.35?{t:"listen",i}:{t:"mc",i,dir:Math.random()<.5?"en2de":"de2en"}):{t:"type",i,dir:pickDir(i)};
  const budget=MAX-fresh.length*2-review.length;                 // mind. 6 Plätze fürs Abrufen
  // Erst Wörter, die schon erkannt werden (→ aus dem Kopf schreiben), dann frisch entdeckte, dann fällige Wiederholungen
  const pool=learning.concat(dueReady);const main=pool.slice(0,budget).map(forWord);
  let q=shuffle(main.concat(review.map(i=>({t:"type",i,dir:Math.random()<.5?"de2en":"en2de",rev:true}))));
  const step=fresh.length?Math.max(2,Math.floor((q.length+fresh.length*2)/fresh.length)):0;
  fresh.forEach((i,n)=>{const pos=Math.min(q.length,n*step);q.splice(pos,0,{t:"discover",i});q.splice(Math.min(q.length,pos+3),0,{t:"mc",i,dir:"en2de"})});
  if(!q.length)q=shuffle(idx).slice(0,8).map(i=>({t:"type",i,dir:Math.random()<.5?"de2en":"en2de"}));
  return q}

    <p class="small muted" style="margin-top:10px">Vorher wird automatisch ein Wiederherstellungspunkt angelegt.</p>`)};rd.readAsText(f)}
function mergeData(a,b){const o=sanitize(JSON.parse(JSON.stringify(a)));
  Object.keys(b.words).forEach(k=>{const x=o.words[k],y=b.words[k];if(!x||y.last>x.last)o.words[k]=y});
  Object.keys(b.notes).forEach(k=>{if(!o.notes[k])o.notes[k]=b.notes[k]});
  const seen=new Set(o.tests.map(t=>t.date));b.tests.forEach(t=>{if(!seen.has(t.date))o.tests.push(t)});o.tests.sort((x,y)=>x.date-y.date);o.tests=o.tests.slice(-200);
  o.xp=Math.max(o.xp,b.xp);if((b.lastDay||"")>(o.lastDay||"")){o.lastDay=b.lastDay;o.streak=b.streak}
  o.badges=[...new Set([...o.badges,...b.badges])];Object.assign(o.stories,b.stories);
  Object.keys(b.week).forEach(k=>{const x=o.week[k],y=b.week[k];o.week[k]=x?{a:Math.max(x.a,y.a),c:Math.max(x.c,y.c),n:Math.max(x.n,y.n)}:y});
  if(b.updatedAt>o.updatedAt&&b.unit){o.unit=b.unit;o.done=b.done}Object.assign(o.results,b.results);o.updatedAt=Math.max(a.updatedAt,b.updatedAt);return o}
function doImport(replace){if(!IMP)return;if(replace&&!confirm("Wirklich ALLE Kinder und Lernstände auf diesem Gerät ersetzen?"))return;
  snapshot(replace?"Import (ersetzt)":"Import (zusammengeführt)");
  if(replace){P.list.forEach(p=>{ls.del(K.data(p.id));ls.del(K.img(p.id))});P.list=[]}
  IMP.profs.forEach(p=>{let ex=P.list.find(x=>x.id===p.id)||P.list.find(x=>x.name.toLowerCase()===p.name.toLowerCase());
    if(!ex){ex={id:p.id,name:p.name,avatar:p.avatar};P.list.push(ex);ls.set(K.data(ex.id),JSON.stringify(IMP.data[p.id]));ls.set(K.img(ex.id),JSON.stringify(IMP.imgs[p.id]))}
    else{const merged=mergeData(ex.id===P.active?S:loadData(ex.id),IMP.data[p.id]);ls.set(K.data(ex.id),JSON.stringify(merged));
      const im=Object.assign({},IMP.imgs[p.id],loadImgs(ex.id));ls.set(K.img(ex.id),JSON.stringify(im))}});
  if(!P.list.find(x=>x.id===P.active))P.active=P.list[0].id;saveProfiles();S=loadData(P.active);IMG=loadImgs(P.active);IMP=null;closeSheet();toast("Import erfolgreich ✅");go("eltern")}

go(P.active?(S.unit&&UNITS[S.unit.key]?"heute":"unit"):(P.list.length?"profiles":"newProfile"));
